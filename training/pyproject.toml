[project]
name = "wetvia-training"
version = "0.1.0"
description = "Isolated training environment for Wetvia LoRA experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  "pillow>=11,<13",
  "unsloth[cu128-ampere-torch2110]==2026.11.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
