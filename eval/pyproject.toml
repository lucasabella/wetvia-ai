[project]
name = "wetvia-eval"
version = "0.0.0"
description = "Benchmark- en eval-harness van Wetvia. Code is AGPL-3.0-only; eval/data/ is CC BY 4.0."
readme = "README.md"
authors = [{ name = "Luca Sabella" }]
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.scripts]
wetvia-bench = "wetvia_eval.bench:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wetvia_eval"

[tool.ruff]
extend = "../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
