# Virtual uv-workspace. The root is not a package.
# Members: apps/api (AGPL-3.0-only) and packages/nl-wetten-ingest (Apache-2.0).
# training/ is not a member. Torch and Unsloth clash with the API dependencies,
# and a workspace shares one lockfile. See the README.

[tool.uv.workspace]
members = ["apps/api", "packages/nl-wetten-ingest"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nl_wetten_ingest", "wetvia"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/nl-wetten-ingest/tests"]
addopts = ["-q"]
