[project]
name = "nl-wetten-ingest"
version = "0.0.0"
description = "Herbruikbaar pakket voor Nederlandse wet- en regelgevingsbronnen (BWB, CVDR, Tweede Kamer, DSO)."
readme = "README.md"
authors = [{ name = "Luca Sabella" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nl_wetten_ingest"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
