[project]
name = "wetvia-api"
version = "0.0.0"
description = "FastAPI-backend van Wetvia."
readme = "README.md"
authors = [{ name = "Luca Sabella" }]
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "openai>=1.50,<2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2.1.6",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]

[project.scripts]
wetvia = "wetvia.bootstrap:run_cli"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.15",
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wetvia"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.importlinter]
root_package = "wetvia"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Lagen"
type = "layers"
layers = [
    "wetvia.bootstrap",
    "wetvia.api | wetvia.cli",
    "wetvia.answer | wetvia.dossier | wetvia.documents",
    "wetvia.retrieval | wetvia.ingest | wetvia.citations | wetvia.rules | wetvia.llm",
    "wetvia.embeddings | wetvia.db",
    "wetvia.core",
]

[[tool.importlinter.contracts]]
name = "Domeinkern zonder I/O"
type = "forbidden"
source_modules = ["wetvia.rules", "wetvia.citations", "wetvia.core"]
forbidden_modules = ["sqlalchemy", "httpx", "openai", "fastapi", "sentence_transformers"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
