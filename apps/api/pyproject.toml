[project]
name = "wetvia-api"
version = "0.0.0"
description = "FastAPI-backend van Wetvia. Skelet zonder applicatiecode."
readme = "README.md"
authors = [{ name = "Luca Sabella" }]
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wetvia"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["wetvia"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
