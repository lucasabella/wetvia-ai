[alembic]
script_location = src/wetvia/db/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Fallback only. DATABASE_URL wins when it is non-empty. Placeholder matches .env.example.
sqlalchemy.url = postgresql+psycopg://wetvia:change-me@127.0.0.1:5432/wetvia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
